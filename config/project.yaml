# ContextForge — project-level configuration
# ──────────────────────────────────────────────────────────────────────────────
# This file contains values that are safe to check in.
# Secrets and environment-specific paths belong in .env (gitignored).
# ──────────────────────────────────────────────────────────────────────────────

project:
  name: "ContextForge"
  version: "0.1.0"
  description: >
    Domain-specific QA system comparing Base LLM, RAG, and fine-tuned LLM.

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR

# ── Paths (relative to project root; override via .env) ───────────────────────
paths:
  data_dir: "data"
  artifacts_dir: "artifacts"
  config_dir: "config"

# ── Database (runtime DB is gitignored) ───────────────────────────────────────
database:
  path: "data/contextforge.db"

# ── Decisions that must be made before later phases start ─────────────────────
# These are listed explicitly so the coding agent stops and asks the human
# rather than silently choosing a value.
pending_decisions:
  domain: "cybersecurity knowledge and defensive security guidance"  # Approved in Phase 1 (D-005)
  corpus_sources: "OWASP Top 10:2025, NIST CSF 2.0, CISA CPG 2.0"   # Approved in Phase 1 (D-008)
  base_llm: "PHASE_4_DECISION"                                      # Phase 4 gate
  embedding_model: "PHASE_3_DECISION"                               # Phase 3 gate
