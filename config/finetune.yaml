# ContextForge — Phase 8 Pilot QLoRA Fine-Tuning Configuration
# ──────────────────────────────────────────────────────────────────────────────
# Defines the hyperparameters and runtime options for the Phase 8 pilot QLoRA run.
# Standard: Hugging Face PEFT + TRL SFTTrainer + bitsandbytes 4-bit NF4.
# ──────────────────────────────────────────────────────────────────────────────

model:
  id: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: false

dataset:
  train_path: "data/qa/finetune_train.jsonl"
  val_path: "data/qa/finetune_val.jsonl"
  test_path: "data/qa/finetune_test.jsonl"  # Untouched for training/tuning
  max_seq_length: 512

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "auto"  # "auto" -> bfloat16 if supported by GPU, else float16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "all-linear"

training:
  output_dir: "artifacts/finetuning/phase8_pilot"
  num_train_epochs: 3
  learning_rate: 0.0002  # 2e-4
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  lr_scheduler_type: "linear"
  weight_decay: 0.0
  seed: 42
  logging_steps: 1
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 1
  report_to: "none"
