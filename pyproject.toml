# ContextForge — pyproject.toml
# Python ≥ 3.10 required (3.13 confirmed available).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextforge"
version = "0.1.0"
description = "Domain-specific QA system comparing Base LLM, RAG, and fine-tuned LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# ── Core dependencies (Phase 0 — only what is needed NOW) ──────────────────
# Later phases will extend this list after the human approves each addition.
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "pandas>=2.0.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "accelerate>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "integration: mark test as integration test",
]

